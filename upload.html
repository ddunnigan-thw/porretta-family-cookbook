  main { width:100%; max-width:520px; background:var(--card);
         border:1px solid #e7dcc8; border-radius:14px; padding:28px 24px;

  .sub { margin:0 0 22px; color:#6d5c4b; font-size:.98rem; }
  label { display:block; margin:0 0 16px; font-size:.95rem; font-weight:bold; }
  input[type=text], input[type=file] {
    display:block; width:100%; margin-top:6px; padding:12px;
    font-size:1rem; font-family:inherit; color:var(--ink);
    border:1px solid #d8c9ae; border-radius:8px; background:#fff; }
  input[type=file] { padding:10px; }
  .hint { font-weight:normal; color:#8a7660; font-size:.85rem; }
  button { width:100%; padding:14px; font-size:1.05rem; font-family:inherit;
           font-weight:bold; color:#fff; background:var(--accent);
           border:none; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.55; cursor:wait; }
  #status { margin:16px 0 0; font-size:.95rem; min-height:1.4em; }
  #status.ok { color:#2e7d32; } #status.err { color:#b3261e; }
  .foot { margin-top:22px; font-size:.85rem; color:#8a7660; text-align:center; }

<script>
(function () {
  var SUPABASE_URL = 'https://yrcvhuzvoznebuuoiyvc.supabase.co';
  // Public anonymous key (designed to be embedded in web pages).
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlyY3ZodXp2b3puZWJ1dW9peXZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MTYxMTEsImV4cCI6MjEwNDk5MjExMX0.ck_b9H7wL840vSLX2uPDyKpdjfNUX4OYM8qWNM0-x04';
  var MAX_BYTES = 15 * 1024 * 1024;

  var form = document.getElementById('uploadForm');
  var statusEl = document.getElementById('status');
  var btn = document.getElementById('submitBtn');

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = cls || '';
  }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var recipe = document.getElementById('recipe').value.trim();
    var name = document.getElementById('name').value.trim();
    var caption = document.getElementById('caption').value.trim();
    var file = document.getElementById('photo').files[0];

    if (!recipe) { setStatus('Please choose or type the recipe name.', 'err'); return; }
    if (!file) { setStatus('Please choose a photo to upload.', 'err'); return; }
    if (file.size > MAX_BYTES) { setStatus('Please choose a photo under 15 MB.', 'err'); return; }
    if (!name) { setStatus('Please tell us your name.', 'err'); return; }

    btn.disabled = true;
    setStatus('Uploading your photo…', '');

    var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
    var path = 'site-uploads/' + uuid() + '.' + ext;

    fetch(SUPABASE_URL + '/storage/v1/object/recipe-photos/' + path, {
      method: 'POST',
      headers: {
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + ANON_KEY,
        'Content-Type': file.type || 'image/jpeg',
        'x-upsert': 'false'
      },
      body: file
    }).then(function (up) {
      if (!up.ok) throw new Error('upload-' + up.status);
      return fetch(SUPABASE_URL + '/rest/v1/photo_submissions', {
        method: 'POST',
        headers: {
          'apikey': ANON_KEY,
          'Authorization': 'Bearer ' + ANON_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({
          uploader_name: name,
          recipe_name: recipe,
          caption: caption,
          photo_path: path,
          status: 'approved'
        })
      });
    }).then(function (ins) {
      if (!ins.ok) throw new Error('save-' + ins.status);
      setStatus('Thank you, ' + name + '! Your photo will appear on the family site within the hour.', 'ok');
      form.reset();
    }).catch(function (err) {
      var msg = 'Something went wrong uploading your photo. Please try again.';
      if (err && err.message && err.message.indexOf('Failed to fetch') !== -1) {
        msg = 'Could not reach the photo service. Check your connection and try again.';
      }
      setStatus(msg, 'err');
    }).then(function () {
      btn.disabled = false;
    });
  });
})();
</script>
